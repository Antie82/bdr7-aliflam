<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran PAI - Alif Lam Syamsiyah & Qamariyah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Amiri for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],
                    },
                    colors: {
                        islamic: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        sun: {
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        moon: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .arabic-text { font-family: 'Amiri', serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <script>
        // Konfigurasi Guru dan Tautan
        const CONFIG = {
            NAMA_GURU: "Besse' Rianti, S.Pd.I",
            MAPEL: "PAI dan Budi Pekerti",
            KELAS: "VII SMP",
            MATERI: "Alif Lam Syamsiyah dan Alif Lam Qamariyah",
            GOOGLE_DOCS_URL: "https://docs.google.com/document/d/1-example-docs-url/edit",
            GOOGLE_SCRIPT_URL: "",
            GOOGLE_SHEET_URL: "https://docs.google.com/spreadsheets/d/1-example-sheet-url/edit"
        };

        // Data Siswa yang sedang login
        let studentSession = {
            nama: "",
            kelas: "",
            absen: "",
            waktuLogin: null
        };
    </script>

    <!-- Modal Login Identitas Siswa -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 md:p-8 border-t-8 border-islamic-600 animate-fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-islamic-100 rounded-full flex items-center justify-center mx-auto mb-3 text-islamic-700 text-2xl shadow-inner">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Selamat Datang!</h2>
                <p class="text-sm text-slate-600 mt-1">Media Pembelajaran PAI Kelas 7<br><span class="font-semibold text-islamic-700">Alif Lam Syamsiyah & Qamariyah</span></p>
                <p class="text-xs text-slate-500 mt-1">Guru Pengampu: <span class="font-medium">Besse' Rianti, S.Pd.I</span></p>
            </div>
            <form id="studentForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama Lengkap Siswa</label>
                    <input type="text" id="inputNama" required placeholder="Contoh: Ahmad Fadhil" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-islamic-500 focus:outline-none text-slate-800 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kelas</label>
                    <input type="text" id="inputKelas" required placeholder="Contoh: VII A" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-islamic-500 focus:outline-none text-slate-800 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nomor Absen</label>
                    <input type="number" id="inputAbsen" required placeholder="Contoh: 12" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-islamic-500 focus:outline-none text-slate-800 text-sm">
                </div>
                <button type="submit" class="w-full py-3.5 bg-islamic-600 hover:bg-islamic-700 text-white font-semibold rounded-xl shadow-lg shadow-islamic-600/30 transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk Belajar
                </button>
            </form>
        </div>
    </div>

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-islamic-600 text-white flex items-center justify-center font-bold text-lg shadow">
                    <i class="fa-solid fa-book-quran"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 text-sm sm:text-base leading-tight">PAI Kelas 7</h1>
                    <p class="text-xs text-slate-500">Alif Lam Syamsiyah & Qamariyah</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="studentBadge" class="hidden sm:flex items-center gap-2 bg-islamic-50 text-islamic-800 px-3 py-1.5 rounded-full text-xs font-medium border border-islamic-200">
                    <i class="fa-solid fa-user-check"></i>
                    <span id="badgeNameText">-</span>
                </div>
                <button onclick="openTeacherDashboard()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl text-xs flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-chalkboard-user text-islamic-600"></i>
                    <span class="hidden md:inline">Dashboard Guru</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Wrapper -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto overflow-hidden">
        <!-- Sidebar Navigation (Desktop) / Bottom Bar (Mobile) -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden lg:flex flex-col justify-between overflow-y-auto p-4 shrink-0">
            <nav class="space-y-1.5" id="sidebarMenu">
                <!-- Menu items will be rendered by JS -->
            </nav>
            <div class="pt-4 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400 font-medium">© 2026 PAI SMP Kelas 7</p>
                <p class="text-[10px] text-slate-400 mt-0.5">Besse' Rianti, S.Pd.I</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24 lg:pb-8" id="mainContent">
            <!-- Dynamic Content Container -->
            <div id="viewContainer" class="max-w-4xl mx-auto space-y-6">
                <!-- Initial view loaded dynamically -->
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center z-40 shadow-lg" id="mobileNav">
        <!-- Rendered via JS -->
    </div>

    <!-- Custom Notification Modal -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform transition-all">
            <div id="modalIcon" class="w-14 h-14 rounded-full bg-islamic-100 text-islamic-600 text-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mb-2">Informasi</h3>
            <p id="modalMessage" class="text-sm text-slate-600 mb-6">Pesan informasi...</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-islamic-600 text-white font-semibold rounded-xl text-sm shadow-md hover:bg-islamic-700 transition-colors">Tutup</button>
        </div>
    </div>

    <script>
        // Definisi Menu Utama
        const menuItems = [
            { id: 'beranda', title: 'Beranda', icon: 'fa-house', badge: '' },
            { id: 'materi', title: 'Materi', icon: 'fa-book-open', badge: '' },
            { id: 'huruf', title: 'Huruf', icon: 'fa-font', badge: '' },
            { id: 'contoh', title: 'Contoh Al-Qur\'an', icon: 'fa-quran', badge: '' },
            { id: 'latihan-membaca', title: 'Latihan Membaca', icon: 'fa-volume-high', badge: '' },
            { id: 'game', title: 'Game Edukatif', icon: 'fa-gamepad', badge: '4 Game' },
            { id: 'latihan', title: 'Latihan Soal', icon: 'fa-pen-to-square', badge: '20 Soal' },
            { id: 'kuis', title: 'Kuis Evaluasi', icon: 'fa-brain', badge: '20 Soal' },
            { id: 'evaluasi', title: 'Evaluasi Akhir', icon: 'fa-square-poll-vertical', badge: '30 Soal' },
            { id: 'docs', title: 'Google Docs', icon: 'fa-file-lines', badge: 'Materi' },
            { id: 'hasil', title: 'Hasil Belajar', icon: 'fa-chart-line', badge: '' }
        ];

        let currentView = 'beranda';

        // Inisialisasi Aplikasi
        window.addEventListener('DOMContentLoaded', () => {
            renderMenus();
            checkSession();
            navigateTo('beranda');
        });

        function checkSession() {
            const saved = localStorage.getItem('pai_student_session');
            if (saved) {
                studentSession = JSON.parse(saved);
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('badgeNameText').textContent = studentSession.nama;
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const nama = document.getElementById('inputNama').value.trim();
            const kelas = document.getElementById('inputKelas').value.trim();
            const absen = document.getElementById('inputAbsen').value.trim();

            if (!nama || !kelas || !absen) {
                showModal('Peringatan', 'Harap lengkapi semua data identitas!', 'warning');
                return;
            }

            studentSession = {
                nama,
                kelas,
                absen,
                waktuLogin: new Date().toISOString()
            };

            localStorage.setItem('pai_student_session', JSON.stringify(studentSession));
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('badgeNameText').textContent = nama;
            showModal('Berhasil', `Selamat datang, ${nama}! Silakan mulai belajar.`, 'success');
        }

        function showModal(title, message, type = 'success') {
            const modal = document.getElementById('customModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            const iconDiv = document.getElementById('modalIcon');
            
            if (type === 'success') {
                iconDiv.className = 'w-14 h-14 rounded-full bg-islamic-100 text-islamic-600 text-2xl flex items-center justify-center mx-auto mb-4';
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else if (type === 'warning') {
                iconDiv.className = 'w-14 h-14 rounded-full bg-amber-100 text-amber-600 text-2xl flex items-center justify-center mx-auto mb-4';
                iconDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconDiv.className = 'w-14 h-14 rounded-full bg-red-100 text-red-600 text-2xl flex items-center justify-center mx-auto mb-4';
                iconDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function renderMenus() {
            const sidebar = document.getElementById('sidebarMenu');
            const mobileNav = document.getElementById('mobileNav');

            let sidebarHTML = '';
            let mobileHTML = '';

            menuItems.forEach(item => {
                const isActive = currentView === item.id;
                const activeClass = isActive ? 'bg-islamic-600 text-white font-semibold shadow-md shadow-islamic-600/20' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900';

                sidebarHTML += `
                    <button onclick="navigateTo('${item.id}')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm transition-all ${activeClass}">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid ${item.icon} w-5 text-center ${isActive ? 'text-white' : 'text-islamic-600'}"></i>
                            <span>${item.title}</span>
                        </div>
                        ${item.badge ? `<span class="text-[10px] px-2 py-0.5 rounded-full ${isActive ? 'bg-islamic-700 text-islamic-100' : 'bg-islamic-50 text-islamic-700 font-medium'}">${item.badge}</span>` : ''}
                    </button>
                `;

                if (['beranda', 'materi', 'huruf', 'game', 'kuis'].includes(item.id)) {
                    mobileHTML += `
                        <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center justify-center py-1 px-3 ${isActive ? 'text-islamic-600 font-bold' : 'text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid ${item.icon} text-lg mb-0.5"></i>
                            <span class="text-[10px]">${item.title}</span>
                        </button>
                    `;
                }
            });

            sidebar.innerHTML = sidebarHTML;
            mobileNav.innerHTML = mobileHTML;
        }

        function navigateTo(viewId) {
            currentView = viewId;
            renderMenus();
            const container = document.getElementById('viewContainer');
            
            // Scroll to top
            document.getElementById('mainContent').scrollTo({ top: 0, behavior: 'smooth' });

            switch(viewId) {
                case 'beranda':
                    container.innerHTML = renderBeranda();
                    break;
                case 'materi':
                    container.innerHTML = renderMateri();
                    break;
                case 'huruf':
                    container.innerHTML = renderHuruf();
                    break;
                case 'contoh':
                    container.innerHTML = renderContohQuran();
                    break;
                case 'latihan-membaca':
                    container.innerHTML = renderLatihanMembaca();
                    break;
                case 'game':
                    container.innerHTML = renderGameHub();
                    break;
                case 'latihan':
                    container.innerHTML = renderLatihanSoal();
                    break;
                case 'kuis':
                    container.innerHTML = renderKuis();
                    break;
                case 'evaluasi':
                    container.innerHTML = renderEvaluasi();
                    break;
                case 'docs':
                    container.innerHTML = renderGoogleDocs();
                    break;
                case 'hasil':
                    container.innerHTML = renderHasilBelajar();
                    break;
                default:
                    container.innerHTML = `<div class="p-6 bg-white rounded-2xl shadow-sm"><h2 class="text-xl font-bold">Halaman tidak ditemukan</h2></div>`;
            }
        }

        function renderBeranda() {
            const student = studentSession.nama ? `${studentSession.nama} (${studentSession.kelas})` : 'Siswa';
            return `
                <div class="space-y-6">
                    <!-- Hero Card -->
                    <div class="bg-gradient-to-br from-islamic-700 to-islamic-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                        <div class="absolute right-0 bottom-0 opacity-10 transform translate-x-10 translate-y-10">
                            <i class="fa-solid fa-quran text-9xl"></i>
                        </div>
                        <div class="relative z-10 max-w-2xl">
                            <div class="inline-flex items-center gap-2 bg-islamic-600/80 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-islamic-100 mb-4 border border-islamic-500">
                                <i class="fa-solid fa-user-tie"></i> Guru: ${CONFIG.NAMA_GURU}
                            </div>
                            <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight mb-3">Alif Lam Syamsiyah & Qamariyah</h2>
                            <p class="text-islamic-100 text-sm sm:text-base leading-relaxed mb-6">Selamat datang, <span class="font-bold underline">${student}</span>! Pelajari hukum bacaan Alif Lam dalam Al-Qur'an dengan mudah, interaktif, dan menyenangkan.</p>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="navigateTo('materi')" class="px-5 py-3 bg-white text-islamic-800 font-semibold rounded-xl text-sm shadow-md hover:bg-islamic-50 transition-all flex items-center gap-2">
                                    <i class="fa-solid fa-book-open"><span>Mulai Belajar</span></i>
                                </button>
                                <button onclick="navigateTo('game')" class="px-5 py-3 bg-sun-500 hover:bg-sun-600 text-white font-semibold rounded-xl text-sm shadow-md transition-all flex items-center gap-2">
                                    <i class="fa-solid fa-gamepad"><span>Main Game</span></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Learning Roadmap / Alur Belajar -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                        <h3 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <i class="fa-solid fa-route text-islamic-600"></i> Alur Pembelajaran Interaktif
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div onclick="navigateTo('materi')" class="bg-slate-50 hover:bg-islamic-50 p-4 rounded-2xl border border-slate-200 hover:border-islamic-300 transition-all cursor-pointer text-center group">
                                <div class="w-12 h-12 bg-islamic-100 text-islamic-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-book-open text-lg"></i>
                                </div>
                                <h4 class="font-semibold text-slate-800 text-sm mb-1">1. Mengenal</h4>
                                <p class="text-xs text-slate-500">Pahami konsep dasar</p>
                            </div>
                            <div onclick="navigateTo('huruf')" class="bg-slate-50 hover:bg-islamic-50 p-4 rounded-2xl border border-slate-200 hover:border-islamic-300 transition-all cursor-pointer text-center group">
                                <div class="w-12 h-12 bg-sun-500/10 text-sun-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-font text-lg"></i>
                                </div>
                                <h4 class="font-semibold text-slate-800 text-sm mb-1">2. Memahami</h4>
                                <p class="text-xs text-slate-500">Pelajari 28 huruf</p>
                            </div>
                            <div onclick="navigateTo('game')" class="bg-slate-50 hover:bg-islamic-50 p-4 rounded-2xl border border-slate-200 hover:border-islamic-300 transition-all cursor-pointer text-center group">
                                <div class="w-12 h-12 bg-moon-500/10 text-moon-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-gamepad text-lg"></i>
                                </div>
                                <h4 class="font-semibold text-slate-800 text-sm mb-1">3. Bermain</h4>
                                <p class="text-xs text-slate-500">Asah kemampuan</p>
                            </div>
                            <div onclick="navigateTo('kuis')" class="bg-slate-50 hover:bg-islamic-50 p-4 rounded-2xl border border-slate-200 hover:border-islamic-300 transition-all cursor-pointer text-center group">
                                <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-brain text-lg"></i>
                                </div>
                                <h4 class="font-semibold text-slate-800 text-sm mb-1">4. Evaluasi</h4>
                                <p class="text-xs text-slate-500">Kerjakan kuis & tes</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMateri() {
            return `
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-12 h-12 rounded-2xl bg-islamic-100 text-islamic-700 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Materi Utama Alif Lam</h2>
                                <p class="text-xs sm:text-sm text-slate-500">Pengertian, Ciri-ciri, dan Perbedaan Syamsiyah & Qamariyah</p>
                            </div>
                        </div>

                        <!-- Tab Selector -->
                        <div class="flex border-b border-slate-200 mb-6 overflow-x-auto">
                            <button onclick="switchMateriTab('syamsiyah')" id="tabSyamsiyahBtn" class="px-5 py-3 font-semibold text-sm border-b-2 border-islamic-600 text-islamic-700 flex items-center gap-2 whitespace-nowrap">
                                <i class="fa-solid fa-sun text-sun-500"></i> Alif Lam Syamsiyah
                            </button>
                            <button onclick="switchMateriTab('qamariyah')" id="tabQamariyahBtn" class="px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap">
                                <i class="fa-solid fa-moon text-moon-500"></i> Alif Lam Qamariyah
                            </button>
                            <button onclick="switchMateriTab('perbandingan')" id="tabPerbandinganBtn" class="px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap">
                                <i class="fa-solid fa-table-cells"></i> Tabel Perbandingan
                            </button>
                        </div>

                        <!-- Tab Content -->
                        <div id="materiTabContent" class="space-y-6">
                            <!-- Default Syamsiyah Content -->
                            ${getSyamsiyahContentHTML()}
                        </div>
                    </div>
                </div>
            `;
        }

        function switchMateriTab(tab) {
            const btnS = document.getElementById('tabSyamsiyahBtn');
            const btnQ = document.getElementById('tabQamariyahBtn');
            const btnP = document.getElementById('tabPerbandinganBtn');
            const content = document.getElementById('materiTabContent');

            btnS.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap";
            btnQ.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap";
            btnP.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap";

            if (tab === 'syamsiyah') {
                btnS.className = "px-5 py-3 font-semibold text-sm border-b-2 border-islamic-600 text-islamic-700 flex items-center gap-2 whitespace-nowrap";
                content.innerHTML = getSyamsiyahContentHTML();
            } else if (tab === 'qamariyah') {

            const container = document.getElementById('viewContainer');

            for (let i = 1; i <= total; i++) {

                const q = questions[currentQ];
                container.innerHTML = `

        function finishQuiz(type, score, total) {
            const nilai = Math.round((score / total) * 100);
            let predikat = '';
            let warnaPredikat = '';

            if (nilai >= 90) { predikat = 'Sangat Baik'; warnaPredikat = 'text-emerald-600 bg-emerald-50'; }
            else if (nilai >= 80) { predikat = 'Baik'; warnaPredikat = 'text-islamic-600 bg-islamic-50'; }
            else if (nilai >= 70) { predikat = 'Cukup'; warnaPredikat = 'text-amber-600 bg-amber-50'; }
            else { predikat = 'Perlu Bimbingan'; warnaPredikat = 'text-red-600 bg-red-50'; }

            // Simpan hasil ke localStorage
            const hasilItem = {
                tanggal: new Date().toLocaleDateString(),
                nama: studentSession.nama || 'Siswa',
                kelas: studentSession.kelas || 'VII',
                absen: studentSession.absen || '1',
                materi: CONFIG.MATERI,
                jenisTes: type.toUpperCase(),
                nilai: nilai,
                benar: score,
                salah: total - score
            };

            let riwayat = JSON.parse(localStorage.getItem('pai_riwayat_belajar') || '[]');
            riwayat.push(hasilItem);
            localStorage.setItem('pai_riwayat_belajar', JSON.stringify(riwayat));

            // Kirim ke Google Spreadsheet via Apps Script jika URL tersedia
            if (CONFIG.GOOGLE_SCRIPT_URL) {
                fetch(CONFIG.GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',

                    body: JSON.stringify(hasilItem)
                }).catch(err => console.error('Error sending to sheet:', err));

            const container = document.getElementById('viewContainer');
            container.innerHTML = `

                    </div>

                        <div class="flex justify-between"><span class="text-slate-500">Kelas / Absen:</span> <span class="font-bold text-slate-800">${hasilItem.kelas} / ${hasilItem.absen}</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Jawaban Benar:</span> <span class="font-bold text-emerald-600">${score}</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">Jawaban Salah:</span> <span class="font-bold text-red-600">${total - score}</span></div>
                        <div class="flex justify-between pt-2 border-t border-slate-200"><span class="text-slate-700 font-bold">Nilai Akhir:</span> <span class="font-extrabold text-islamic-700 text-base">${nilai}</span></div>
                        <div class="flex justify-between items-center"><span class="text-slate-700 font-bold">Predikat:</span> <span class="px-3 py-1 rounded-full font-bold ${warnaPredikat}">${predikat}</span></div>
                    </div>

                    <p class="text-xs text-slate-600 italic">"Teruslah giat belajar Al-Qur'an agar kelak menjadi syafaat di hari kiamat."</p>

                    <div class="flex gap-3">
                        <button onclick="navigateTo('hasil')" class="flex-1 py-3 bg-islamic-600 hover:bg-islamic-700 text-white font-semibold rounded-xl text-xs shadow-md transition-all">Lihat Hasil Belajar</button>
                        <button onclick="navigateTo('beranda')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all">Kembali ke Beranda</button>
                    </div>
                </div>
            `;
        }

        function renderGoogleDocs() {
            return `
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-12 h-12 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-file-lines"></i>
                            </div>
                            <div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Materi & LKPD (Google Docs)</h2>
                                <p class="text-xs sm:text-sm text-slate-500">Akses dokumen pembelajaran lengkap, LKPD, dan modul PAI</p>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <a href="${CONFIG.GOOGLE_DOCS_URL}" target="_blank" class="flex items-center justify-between p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-2xl transition-all group">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-500 text-white flex items-center justify-center text-base"><i class="fa-solid fa-book"></i></div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm group-hover:text-blue-600">Materi Lengkap Alif Lam</h4>
                                        <p class="text-xs text-slate-500">Modul resmi PAI Kelas 7 SMP</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-blue-600"></i>
                            </a>

                            <a href="${CONFIG.GOOGLE_DOCS_URL}" target="_blank" class="flex items-center justify-between p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-2xl transition-all group">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-base"><i class="fa-solid fa-pen-to-square"></i></div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm group-hover:text-blue-600">LKPD Siswa (Lembar Kerja)</h4>
                                        <p class="text-xs text-slate-500">Tugas mandiri dan kelompok</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-blue-600"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHasilBelajar() {
            const riwayat = JSON.parse(localStorage.getItem('pai_riwayat_belajar') || '[]');
            let rows = '';

            if (riwayat.length === 0) {
                rows = `<tr><td colspan="6" class="p-6 text-center text-slate-400 text-xs">Belum ada riwayat tes yang tersimpan. Ayo kerjakan kuis!</td></tr>`;
            } else {
                riwayat.forEach((item, idx) => {
                    rows += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 text-slate-600">${idx + 1}</td>
                            <td class="p-3 font-medium text-slate-800">${item.nama} (${item.kelas})</td>
                            <td class="p-3 text-slate-600">${item.jenisTes}</td>
                            <td class="p-3 font-bold text-islamic-700">${item.nilai}</td>
                            <td class="p-3 text-emerald-600 font-semibold">${item.benar}</td>
                            <td class="p-3 text-red-600 font-semibold">${item.salah}</td>
                        </tr>
                    `;
                });
            }

            return `
                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl bg-islamic-100 text-islamic-700 flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-chart-line"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900">Hasil Belajar Siswa</h2>
                                    <p class="text-xs sm:text-sm text-slate-500">Rekapitulasi nilai latihan dan evaluasi kamu</p>
                                </div>
                            </div>
                            <button onclick="localStorage.removeItem('pai_riwayat_belajar'); navigateTo('hasil');" class="px-3 py-1.5 bg-red-50 text-red-600 font-medium rounded-xl text-xs hover:bg-red-100">Reset Riwayat</button>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs sm:text-sm">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-700">
                                        <th class="p-3 rounded-l-xl">No</th>
                                        <th class="p-3">Nama (Kelas)</th>
                                        <th class="p-3">Jenis Tes</th>
                                        <th class="p-3">Nilai</th>
                                        <th class="p-3">Benar</th>
                                        <th class="p-3 rounded-r-xl">Salah</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openTeacherDashboard() {
            const riwayat = JSON.parse(localStorage.getItem('pai_riwayat_belajar') || '[]');
            let totalSiswa = riwayat.length;
            let totalNilai = riwayat.reduce((acc, curr) => acc + curr.nilai, 0);
            let rataRata = totalSiswa > Math.max ? Math.round(totalNilai / totalSiswa) : (totalSiswa > 0 ? Math.round(totalNilai / totalSiswa) : 0);
            let tertinggi = totalSiswa > 0 ? Math.max(...riwayat.map(r => r.nilai)) : 0;
            let terendah = totalSiswa > 0 ? Math.min(...riwayat.map(r => r.nilai)) : 0;

            let rows = '';
            riwayat.forEach((r, i) => {
                rows += `
                    <tr>
                        <td class="p-2.5 text-slate-600">${i+1}</td>
                        <td class="p-2.5 font-medium text-slate-800">${r.tanggal}</td>
                        <td class="p-2.5 font-medium text-slate-800">${r.nama} (${r.kelas})</td>
                        <td class="p-2.5 text-slate-600">${r.jenisTes}</td>
                        <td class="p-2.5 font-bold text-islamic-700">${r.nilai}</td>
                    </tr>
                `;
            });

            const dashboardHTML = `
                <div id="teacherModal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 space-y-6 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-islamic-100 text-islamic-700 rounded-2xl flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                </div>
                                <div>
                                    <h3 class="text-xl font-bold text-slate-900">Dashboard Guru PAI</h3>
                                    <p class="text-xs text-slate-500">Pengampu: ${CONFIG.NAMA_GURU}</p>
                                </div>
                            </div>
                            <button onclick="document.getElementById('teacherModal').remove()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center">
                                <span class="text-xs text-slate-500 block mb-1">Total Pengerjaan</span>
                                <span class="text-xl font-bold text-slate-800">${totalSiswa}</span>
                            </div>
                            <div class="bg-islamic-50 p-4 rounded-2xl border border-islamic-200 text-center">
                                <span class="text-xs text-islamic-700 block mb-1">Nilai Rata-Rata</span>
                                <span class="text-xl font-bold text-islamic-800">${rataRata}</span>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 text-center">
                                <span class="text-xs text-emerald-700 block mb-1">Nilai Tertinggi</span>
                                <span class="text-xl font-bold text-emerald-800">${tertinggi}</span>
                            </div>
                            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center">
                                <span class="text-xs text-amber-700 block mb-1">Nilai Terendah</span>
                                <span class="text-xl font-bold text-amber-800">${terendah}</span>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-bold text-slate-800 text-sm mb-3">Daftar Nilai Siswa Terbaru</h4>
                            <div class="overflow-x-auto max-h-48 border border-slate-200 rounded-2xl">
                                <table class="w-full text-left text-xs">
                                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                                        <tr>
                                            <th class="p-2.5">No</th>
                                            <th class="p-2.5">Tanggal</th>
                                            <th class="p-2.5">Nama (Kelas)</th>
                                            <th class="p-2.5">Tes</th>
                                            <th class="p-2.5">Nilai</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${rows || '<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data nilai.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-200 flex flex-wrap gap-3">
                            <a href="${CONFIG.GOOGLE_SHEET_URL}" target="_blank" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs text-center shadow-md transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-file-excel"></i> Buka Google Spreadsheet
                            </a>
                            <button onclick="document.getElementById('teacherModal').remove()" class="px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-all">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', dashboardHTML);
        }
    </script>
</body>
</html>
